<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm p-4 p-md-5">
        
        <div class="mb-3">
          <div class="rounded-circle bg-success-subtle text-success d-inline-flex p-3 fs-1">
            <i class="bi bi-check2-circle"></i>
          </div>
        </div>

        <h2 class="fw-bold text-dark">Congratulations!</h2>
        <p class="text-muted">Your order has been placed successfully.</p>

        

        

        <div class="d-grid gap-2">
          <button class="btn btn-outline-primary" (click)="goToMyOrders()">
            <i class="bi bi-box-seam me-1"></i> Go to My Orders
          </button>
          <button class="btn btn-primary" (click)="continueShopping()">
            <i class="bi bi-bag me-1"></i> Continue Shopping
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
