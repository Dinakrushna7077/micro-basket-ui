<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">

      <h3 class="fw-bold mb-4">Checkout</h3>

      @if (errorMessage()) {
        <div class="alert alert-danger mb-4">{{ errorMessage() }}</div>
      }

      <div class="row g-4">
        <!-- Left Column: Address & Payment -->
        <div class="col-md-7">
          
          <!-- Delivery Address Section -->
          <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
              <h5 class="card-title fw-bold mb-3">
                <span><i class="bi bi-geo-alt-fill text-primary me-2"></i>Delivery Address</span>
                <a class="float-end text-decoration-none" [href]="'/profile/edit/' + accountService.getUserId()">Edit</a>
              </h5>
              <input
                class="form-control"
                rows="3"
                [ngModel]="deliveryAddress()"
                (ngModelChange)="deliveryAddress.set($event)"
                placeholder="Enter complete shipping address"
                [disabled]="true"
              >
            </div>
          </div>

          <!-- Payment Options Section -->
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <h5 class="card-title fw-bold mb-3">
                <i class="bi bi-credit-card-2-front-fill text-primary me-2"></i>Payment Method
              </h5>

              <!-- Cash on Delivery -->
              <div class="form-check p-3 border rounded mb-3" [class.border-primary]="paymentMethod() === 'COD'">
                <input
                  class="form-check-input"
                  type="radio"
                  name="paymentMode"
                  id="cod"
                  value="COD"
                  [checked]="paymentMethod() === 'COD'"
                  (change)="paymentMethod.set('COD')"
                />
                <label class="form-check-label w-100 fw-semibold ms-2" for="cod">
                  Cash on Delivery (COD)
                  <small class="text-muted d-block fw-normal">Pay using cash or UPI upon delivery.</small>
                </label>
              </div>

              <!-- Online Payment Gateway -->
              <div class="form-check p-3 border rounded" [class.border-primary]="paymentMethod() === 'ONLINE'">
                <input
                  class="form-check-input"
                  type="radio"
                  name="paymentMode"
                  id="online"
                  value="ONLINE"
                  [checked]="paymentMethod() === 'ONLINE'"
                  (change)="paymentMethod.set('ONLINE')"
                />
                <label class="form-check-label w-100 fw-semibold ms-2" for="online">
                  Online Payment (Razorpay)
                  <small class="text-muted d-block fw-normal">Cards, NetBanking, UPI, and Wallets.</small>
                </label>
              </div>

            </div>
          </div>

        </div>

        <!-- Right Column: Order Summary & Place Button -->
        <div class="col-md-5">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <h5 class="card-title fw-bold mb-3">Order Summary</h5>

              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Total Items</span>
                <span class="fw-semibold">{{ cartService.totalItems() }}</span>
              </div>

              <div class="d-flex justify-content-between mb-3">
                <span class="text-muted">Delivery Charges</span>
                <span class="text-success fw-semibold">FREE</span>
              </div>

              <hr />

              <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                <span>Payable Amount</span>
                <span>₹{{ cartService.totalPrice() | number:'1.2-2' }}</span>
              </div>

              <button
                class="btn w-100 py-2 fw-semibold"
                [ngClass]="paymentMethod() === 'COD' ? 'btn-success' : 'btn-primary'"
                [disabled]="isPlacingOrder() || !deliveryAddress().trim()"
                (click)="handlePayment()"
              >
                @if (isPlacingOrder()) {
                  <span class="spinner-border spinner-border-sm me-1"></span>
                  Processing...
                } @else if (paymentMethod() === 'COD') {
                  Place Order (COD)
                } @else {
                  Proceed to Pay ₹{{ cartService.totalPrice() | number:'1.2-2' }}
                }
              </button>

            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
