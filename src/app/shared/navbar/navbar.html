<nav class="navbar navbar-expand-lg mb-bg text-light shadow-sm z-10">
  <div class="container">

    <a class="navbar-brand fw-bold d-flex align-items-center" routerLink="/">
      <span class="brand-icon me-2">
        <i class="bi bi-basket2-fill"></i>
      </span>
      <span>
        Micro<span class="brand-highlight">Basket</span>
      </span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">

      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item d-flex">
          <input type="text" class="form-control search-inp" placeholder="search">
          <button class="btn  search-btn"><i class="bi bi-search me-1"></i></button>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-house-door me-1"></i>
            Home
          </a>
        </li>

        @if(accountService.userName()!=null)
        {
          <li class="nav-item">
          <a class="nav-link" routerLink="/my-orders" routerLinkActive="active">
            <i class="bi bi-receipt me-1"></i>
            My Orders
          </a>
        </li>
        }

        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active">
            About
          </a>
        </li>

         <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active">
            Contact
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        @if(accountService.userName()!=null)
        {
          <a routerLink="/cart" class="btn btn-light cart-btn position-relative">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="cart-count">{{ cartCount }}</span>
          </a>
        }

        <ng-container *ngIf="accountService.isLoggedIn(); else loggedOut">
          <div class="dropdown">
            <button
              class="btn btn-outline-light dropdown-toggle px-3"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              <i class="bi bi-person-circle me-1"></i>
              {{ accountService.userName() }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              @if (accountService.role() === 'Admin') {
                <li>
                  <a class="dropdown-item" routerLink="/admin/dashboard">
                    <i class="bi bi-speedometer2 me-2"></i>Admin Dashboard
                  </a>
                </li>
                <li><hr class="dropdown-divider"></li>
              }
              <li>
                <a class="dropdown-item" routerLink="/my-orders">
                  <i class="bi bi-receipt me-2"></i>My Orders
                </a>
              </li>
              <li>
                <a class="dropdown-item" [routerLink]="['/profile', accountService.getUserId()]">
                  <i class="bi bi-person me-2"></i>Profile
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

        <ng-template #loggedOut>
          <a routerLink="/login" class="btn btn-outline-light px-3">
            <i class="bi bi-person me-1"></i>
            Login
          </a>
          <a routerLink="/register" class="btn btn-outline-light px-3">
            Register
          </a>
        </ng-template>

      </div>

    </div>
  </div>
</nav>
